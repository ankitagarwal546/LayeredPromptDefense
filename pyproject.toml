[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-defense"
version = "0.1.0"
description = "Evaluating layered defenses against indirect prompt injection in LLM-based document summarization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed once a trained classifier is added (see docs/ARCHITECTURE.md).
ml = ["transformers>=4.40", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # works even if the editable-install .pth is skipped (see README troubleshooting)
addopts = "-q"
